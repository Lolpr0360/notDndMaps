<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Map</title>
<style>
:root{--ink:#1d2a2f;--paper:#e9e4d4;--panel:#243238;--text:#eef1e8;--muted:#9fb0a8;--accent:#f2c14e}
*{box-sizing:border-box}
body{margin:0;font-family:Trebuchet MS,Verdana,sans-serif;background:var(--ink);color:var(--text);display:flex;height:100vh;height:100dvh}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:8px}
#mapname{font-weight:bold;letter-spacing:.04em}
canvas{max-width:100%;max-height:calc(100% - 30px);aspect-ratio:10/7;border:3px solid var(--paper);border-radius:6px;cursor:crosshair}
aside{width:350px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
h2{margin:0 0 6px;font-size:15px}
#players div{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
#players i{width:12px;height:12px;border-radius:50%;flex:none}
#players small{margin-left:auto;color:var(--muted)}
#panel{background:#1b262b;border-radius:6px;padding:12px;min-height:120px;font-size:14px;line-height:1.45}
#panel .desc{color:var(--muted);font-style:italic;font-size:13px;margin:2px 0 10px}
#panel button{margin:4px 0 0;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:4px;padding:9px;cursor:pointer;font:inherit}
#panel button:hover{background:#fff}
button:focus-visible{outline:3px solid var(--accent)}
#bag{font-size:13px;color:var(--accent)}
#log{font-size:13px;color:var(--muted);flex:1;min-height:80px;overflow-y:auto}
#log p{margin:0 0 4px}
#join{position:fixed;inset:0;background:rgba(20,30,34,.92);display:flex;align-items:center;justify-content:center;z-index:5}
#join form{background:var(--panel);padding:24px;border-radius:8px;display:flex;flex-direction:column;gap:10px;width:280px}
#join input,#join button{font:inherit;padding:10px;border-radius:4px;border:0}
#join button{background:var(--accent);cursor:pointer;font-weight:bold}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;max-height:50%}}
</style></head><body>
<div id="stage"><div id="mapname"></div><canvas id="c" width="1000" height="700"></canvas></div>
<aside>
  <div><h2>Party</h2><div id="players"></div></div>
  <div><h2>Conversation</h2><div id="panel">Click the ground to walk. Click a character or object when you are close.</div></div>
  <div><h2>Your bag</h2><div id="bag">empty</div></div>
  <div style="display:flex;flex-direction:column;flex:1;min-height:0"><h2>News &amp; rolls</h2><div id="log"></div></div>
</aside>
<div id="join"><form id="jf"><b>Join the party</b>
  <input id="nm" maxlength="16" placeholder="Character name" autofocus required>
  <button>Join</button><small id="err"></small></form></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let ws, myId, names = {}, map = null, players = {}, shown = {}, hits = [], camSnap = true;
const cam = { x: 0, y: 0 }, K = { a: 0.7, b: 0.35 };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const addLog = t => $('log').insertAdjacentHTML('afterbegin', `<p>${esc(t)}</p>`);
const tx = o => ws.send(JSON.stringify(o));

$('jf').onsubmit = e => {
  e.preventDefault();
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => tx({ t: 'join', name: $('nm').value });
  ws.onmessage = ev => handle(JSON.parse(ev.data));
  ws.onclose = () => addLog('Disconnected. Refresh to rejoin.');
};
function handle(m) {
  if (m.t === 'full') $('err').textContent = 'Party is full (6/6).';
  if (m.t === 'welcome') { myId = m.id; names = m.names; $('join').remove(); requestAnimationFrame(draw); }
  if (m.t === 'map') { map = m.map; shown = {}; camSnap = true; $('mapname').textContent = map.name; endChat(); }
  if (m.t === 'state') { players = Object.fromEntries(m.players.map(p => [p.id, p])); renderPlayers(); }
  if (m.t === 'dialogue') {
    $('panel').innerHTML = `<b>${esc(m.npc.name)}</b><div class="desc">${esc(m.npc.desc)}</div><p>${esc(m.text)}</p>` +
      m.options.map((o, i) => `<button data-i="${i}">${esc(o.label)}</button>`).join('');
    $('panel').querySelectorAll('button').forEach(b => b.onclick = () => tx({ t: 'pick', i: +b.dataset.i }));
  }
  if (m.t === 'end') endChat();
  if (m.t === 'inv') $('bag').innerHTML = Object.entries(m.inv).map(([k, v]) => esc(k) + (v > 1 ? ' ×' + v : '')).join('<br>') || 'empty';
  if (m.t === 'log' || m.t === 'notice') addLog(m.text);
}
const endChat = () => $('panel').textContent = 'Click the ground to walk. Click a character or object to walk over and talk.';
function renderPlayers() {
  $('players').innerHTML = Object.values(players).map(p =>
    `<div><i style="background:${p.color}"></i><span>${esc(p.name)}${p.id === myId ? ' (you)' : ''}</span><small>${esc(names[p.map] || '')}</small></div>`).join('');
}

cv.onclick = e => {
  if (!map) return;
  const r = cv.getBoundingClientRect(), sx = (e.clientX - r.left) * 1000 / r.width, sy = (e.clientY - r.top) * 700 / r.height;
  let n, x = sx, y = sy;
  if (map.iso) {
    const h = hits.find(h => Math.hypot(h.sx - sx, h.sy - sy) < 30); n = h && h.n;
    const a = (sy - 350 + cam.y) / K.b, b = (sx - 500 + cam.x) / K.a; x = (a + b) / 2; y = (a - b) / 2;
  } else n = map.npcs.find(n => Math.hypot(n.x - x, n.y - y) < 26);
  tx(n ? { t: 'talk', id: n.id } : { t: 'move', x, y });
};

// ---------- isometric helpers (server works in flat x/y; we only project for drawing) ----------
const P = (x, y, z = 0) => [(x - y) * K.a - cam.x + 500, (x + y) * K.b - z - cam.y + 350];
const shade = (c, f) => { const n = parseInt(c.slice(1), 16); return `rgb(${Math.min(255, (n >> 16) * f) | 0},${Math.min(255, ((n >> 8) & 255) * f) | 0},${Math.min(255, (n & 255) * f) | 0})`; };
function poly(pts, fill, stroke) {
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
const flat = (x, y, w, h, c, st) => poly([P(x, y), P(x + w, y), P(x + w, y + h), P(x, y + h)], c, st);
function box(x, y, w, h, z, c, al = 1) {
  ctx.globalAlpha = al;
  poly([P(x, y + h), P(x + w, y + h), P(x + w, y + h, z), P(x, y + h, z)], shade(c, .75));
  poly([P(x + w, y), P(x + w, y + h), P(x + w, y + h, z), P(x + w, y, z)], shade(c, .55));
  poly([P(x, y, z), P(x + w, y, z), P(x + w, y + h, z), P(x, y + h, z)], c);
  ctx.globalAlpha = 1;
}
function slab(d, t = 34) {
  flat(d.x, d.y, d.w, d.h, d.color);
  poly([P(d.x, d.y + d.h), P(d.x + d.w, d.y + d.h), P(d.x + d.w, d.y + d.h, -t), P(d.x, d.y + d.h, -t)], shade(d.color, .6));
  poly([P(d.x + d.w, d.y), P(d.x + d.w, d.y + d.h), P(d.x + d.w, d.y + d.h, -t), P(d.x + d.w, d.y, -t)], shade(d.color, .45));
}
function lbl(t, x, y, size = 12) {
  ctx.font = `bold ${size}px Trebuchet MS`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,30,34,.85)'; ctx.strokeText(t, x, y);
  ctx.fillStyle = '#fff'; ctx.fillText(t, x, y);
}
function dashLine(a, b, c, w, dash) { ctx.setLineDash(dash); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]); }
function person(x, y, col, name, me) {
  const [sx, sy] = P(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(sx, sy, 13, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = col; ctx.strokeStyle = me ? '#fff' : '#1d2a2f'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(sx - 8, sy - 26, 16, 26, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#f1d3b5'; ctx.beginPath(); ctx.arc(sx, sy - 33, 7, 0, 7); ctx.fill(); ctx.stroke();
  lbl(name, sx, sy - 47);
}
function plane(d) {
  box(d.x, d.y, d.len, 36, 38, '#e8eef2');                 // fuselage
  box(d.x + d.len * .4, d.y - 90, 70, 216, 6, '#cfd8dc');  // wings
  box(d.x + 8, d.y + 14, 50, 8, 74, '#d62828');            // tail fin
}
const cmp = (a, b) => {
  const pt = e => e.x0 === e.x1 && e.y0 === e.y1;
  if (!(pt(a) && pt(b))) { if (a.x1 <= b.x0 || a.y1 <= b.y0) return -1; if (b.x1 <= a.x0 || b.y1 <= a.y0) return 1; }
  return (a.x1 + a.y1) - (b.x1 + b.y1);
};

function drawIso() {
  const me = shown[myId];
  if (me) { const f = camSnap ? 1 : .12; cam.x += ((me.x - me.y) * K.a - cam.x) * f; cam.y += ((me.x + me.y) * K.b - 20 - cam.y) * f; camSnap = false; }
  ctx.fillStyle = map.bg; ctx.fillRect(0, 0, 1000, 700); ctx.textAlign = 'center';
  for (const d of map.deco) {
    if (d.kind === 'slab') slab(d);
    if (d.kind === 'ground') { flat(d.x, d.y, d.w, d.h, d.color); if (d.dash) dashLine(P(d.x, d.y + d.h / 2), P(d.x + d.w, d.y + d.h / 2), '#e8e4c8', 3, [18, 16]); }
  }
  for (const f of map.floors) {
    flat(f.x, f.y, f.w, f.h, f.color, 'rgba(0,0,0,.25)');
    if (f.path) { const l = f.w > f.h; dashLine(P(f.x + (l ? 10 : f.w / 2), f.y + (l ? f.h / 2 : 10)), P(f.x + f.w - (l ? 10 : f.w / 2), f.y + f.h - (l ? f.h / 2 : 10)), '#d9a521', 3, [14, 12]); }
  }
  for (const f of map.floors) if (f.label) { ctx.font = 'bold 15px Trebuchet MS'; ctx.fillStyle = 'rgba(29,42,47,.55)'; const [x, y] = P(f.x + f.w / 2, f.y + f.h / 2); ctx.fillText(f.label, x, y); }

  const E = []; hits = [];
  const bx = (o, z, c, al, label) => E.push({ x0: o.x, y0: o.y, x1: o.x + o.w, y1: o.y + o.h, draw: () => { box(o.x, o.y, o.w, o.h, z, c, al); if (label) lbl(label, ...P(o.x + o.w / 2, o.y + o.h / 2, z + 10)); } });
  for (const s of map.solids) bx(s, s.z, s.color, 1, s.label);
  for (const d of map.deco) {
    if (d.kind === 'box') bx(d, d.z, d.color, 1, d.label);
    if (d.kind === 'wall') bx(d, d.z, d.color, .35);
    if (d.kind === 'plane') E.push({ x0: d.x, y0: d.y - 100, x1: d.x + d.len, y1: d.y + 136, draw: () => plane(d) });
  }
  for (const n of map.npcs) E.push({ x0: n.x, x1: n.x, y0: n.y, y1: n.y, draw: () => {
    const [sx, sy] = P(n.x, n.y); hits.push({ n, sx, sy: sy - 15 });
    if (n.kind === 'object') { box(n.x - 12, n.y - 12, 24, 24, 14, n.color); lbl(n.name, ...P(n.x, n.y, 28)); } else person(n.x, n.y, n.color, n.name, false);
  } });
  for (const p of Object.values(players)) if (p.map === map.key) { const s = shown[p.id]; E.push({ x0: s.x, x1: s.x, y0: s.y, y1: s.y, draw: () => person(s.x, s.y, p.color, p.name, p.id === myId) }); }
  E.sort(cmp); E.forEach(e => e.draw());
}

function drawFlat() {
  ctx.fillStyle = map.bg; ctx.fillRect(0, 0, 1000, 700);
  ctx.font = '13px Trebuchet MS'; ctx.textAlign = 'center';
  for (const d of map.deco) { ctx.fillStyle = d.color; ctx.fillRect(d.x, d.y, d.w, d.h); if (d.label) { ctx.fillStyle = '#fff'; ctx.fillText(d.label, d.x + d.w / 2, d.y + d.h / 2 + 4); } }
  for (const n of map.npcs) {
    ctx.fillStyle = n.color; ctx.strokeStyle = '#1d2a2f'; ctx.lineWidth = 3;
    if (n.kind === 'object') { ctx.fillRect(n.x - 12, n.y - 12, 24, 24); ctx.strokeRect(n.x - 12, n.y - 12, 24, 24); }
    else { ctx.beginPath(); ctx.arc(n.x, n.y, 15, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#1d2a2f'; ctx.fillText(n.name, n.x, n.y - 22);
  }
  for (const p of Object.values(players)) if (p.map === map.key) {
    const s = shown[p.id];
    ctx.fillStyle = p.color; ctx.strokeStyle = p.id === myId ? '#fff' : '#1d2a2f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, 11, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1d2a2f'; ctx.fillText(p.name, s.x, s.y - 18);
  }
}
function draw() {
  if (map) {
    for (const p of Object.values(players)) if (p.map === map.key) { const s = shown[p.id] || (shown[p.id] = { x: p.x, y: p.y }); s.x += (p.x - s.x) * .3; s.y += (p.y - s.y) * .3; }
    map.iso ? drawIso() : drawFlat();
  }
  requestAnimationFrame(draw);
}
</script></body></html>
